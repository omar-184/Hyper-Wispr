name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.3.0"
        default: "0.0.0-test"
      publish:
        description: "Publish a GitHub Release (creates tag v<version>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        shell: bash
        # So the About page and --version show the version being released.
        run: sed -i -E 's/^__version__ = ".*"/__version__ = "${{ steps.v.outputs.version }}"/' hyper_wispr/__init__.py

      - name: The compiled AI engine, if cached
        # llama-cpp-python is source-only on PyPI. Compiled once per version and kept in the cache.
        # Not for the build machine's processor: for any with AVX2 (Intel 2013+, AMD 2015+), which
        # local_llm checks before using it. OpenMP off, so no extra Microsoft DLL is needed. Built with
        # clang-cl: llama.cpp's processor code is faster with it than with Microsoft's compiler.
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-python-0.3.36-avx2-clang-py3.12-v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile the AI engine if it isn't cached
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DGGML_OPENMP=OFF -DLLAVA_BUILD=OFF"
        run: |
          ls wheels/llama_cpp_python-*.whl 2>/dev/null || pip wheel --no-deps -w wheels "llama-cpp-python==0.3.36"

      - name: Install dependencies
        shell: bash
        run: |
          pip install --find-links wheels ".[ai]" "pyinstaller>=6.10" packaging
          # Generate the UI Automation wrapper now, so it's bundled instead of written at run time.
          python -c "import comtypes.client as c; c.GetModule('UIAutomationCore.dll'); import comtypes.gen.UIAutomationClient"

      - name: Pin the NVIDIA files
        shell: bash
        # One installer for everyone: the app downloads these from PyPI only on PCs whose NVIDIA
        # card can use them. Exact versions and checksums are fixed here, per release.
        run: python packaging/gpu_manifest.py

      - name: Build app
        shell: bash
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/hyper_wispr.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Hyper-Wispr\Hyper-Wispr.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA\HyperWispr\hyper-wispr.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          # Opens the Settings window for a moment to check the bundled WebView2 page can talk to Python.
          $p = Start-Process -FilePath "dist\Hyper-Wispr\Hyper-Wispr.exe" -ArgumentList "--settings-self-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Settings window self-test hung" }
          Get-Content "$env:APPDATA\HyperWispr\hyper-wispr.log" -Tail 5 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Settings window self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist\Hyper-Wispr\Hyper-Wispr.exe" -ArgumentList "--overlay-self-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Overlay self-test hung" }
          Get-Content "$env:APPDATA\HyperWispr\hyper-wispr.log" -Tail 3 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Overlay self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Hyper-Wispr-Setup-*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
      - name: Copy for older NVIDIA versions
        shell: bash
        # Up to 0.4.0 the NVIDIA build only updated itself to a file ending in -NVIDIA.exe.
        # This is the same installer under that name, so those PCs can still update in the app.
        run: for f in Hyper-Wispr-Setup-*.exe; do cp "$f" "${f%.exe}-NVIDIA.exe"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Hyper-Wispr ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: Hyper-Wispr-Setup-*.exe
          body: |
            ## Download

            - **Hyper-Wispr-Setup-(version).exe**: the installer for every Windows 10/11 PC.
              If your PC has an NVIDIA graphics card that can run the speech model (GTX 10-series, MX150 or newer),
              the first start also downloads its speed-up files once (about 1.3 GB). Older or no NVIDIA cards use the processor.
            - **…-NVIDIA.exe**: an identical copy, only there so versions up to 0.4.0 can update themselves. You don't need it.

            Run the installer (no administrator rights needed), then hold **Ctrl + Win**, speak, and let go.
            The first start downloads the speech model once (about 0.5 to 1.6 GB, plus the NVIDIA files above if your card can use them); after that everything runs offline.
            AI cleanup is built in: the first start also downloads its model once (about 2 GB). Ollama is no longer needed (it can still be chosen in Settings → AI cleanup).

            Windows may show "Windows protected your PC" because the installer isn't code-signed: click **More info → Run anyway**.
