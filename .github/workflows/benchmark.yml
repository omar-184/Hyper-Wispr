name: Benchmark

# Measures each feature (speech model, medical dictation, AI cleanup, paste, shortcuts, history,
# overlay, Settings window, the whole app) on a GitHub Windows machine: no microphone, no NVIDIA
# card. Start it by hand from the Actions tab; the numbers are on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      skip:
        description: "Parts to leave out, comma-separated (medical, history, speech, ai, ai_builtin, turbo, overlay, desktop, app, window)"
        default: ""

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The compiled AI engine, if cached
        # llama-cpp-python is source-only on PyPI. Compiled once per version and kept in the cache.
        # Not for the build machine's processor: for any with AVX2 (Intel 2013+, AMD 2015+), which
        # local_llm checks before using it. OpenMP off, so no extra Microsoft DLL is needed. Built with
        # clang-cl: llama.cpp's processor code is faster with it than with Microsoft's compiler.
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-cpp-python-0.3.36-avx2-clang-py3.12-v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile the AI engine if it isn't cached
        # PowerShell, not bash: Git's bash has its own `link` that would shadow Microsoft's linker.
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DGGML_OPENMP=OFF -DLLAVA_BUILD=OFF"
        run: |
          if (-not (Test-Path wheels/llama_cpp_python-*.whl)) { pip wheel --no-deps -w wheels "llama-cpp-python==0.3.36"; if ($LASTEXITCODE) { exit 1 } }

      - name: Install Hyper-Wispr
        shell: bash
        run: |
          pip install --find-links wheels ".[ai]" psutil edge-tts
          # Generated at build time in the installed app, so it isn't timed here either.
          python -c "import comtypes.client as c; c.GetModule('UIAutomationCore.dll'); import comtypes.gen.UIAutomationClient"

      - name: Install Ollama and the AI cleanup model
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\ollama"
          New-Item -ItemType Directory $dir | Out-Null
          curl.exe -fsSL -o "$env:RUNNER_TEMP\ollama.zip" https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip
          tar -xf "$env:RUNNER_TEMP\ollama.zip" -C $dir
          $env:OLLAMA_MODELS = "$env:RUNNER_TEMP\ollama-models"
          "OLLAMA_MODELS=$env:OLLAMA_MODELS" >> $env:GITHUB_ENV
          $dir >> $env:GITHUB_PATH
          Start-Process -FilePath "$dir\ollama.exe" -ArgumentList "serve" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:11434/api/tags | Out-Null; break } catch { Start-Sleep 1 }
          }
          & "$dir\ollama.exe" --version
          & "$dir\ollama.exe" pull qwen2.5:3b

      - name: Benchmark
        shell: bash
        run: python packaging/benchmark.py --out bench-results --skip "${{ inputs.skip }}"

      - name: Results
        if: always()
        shell: bash
        run: |
          cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat bench-results/results.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: bench-results
