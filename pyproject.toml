[project]
name = "hyper-wispr"
version = "0.5.0"
description = "Offline, customizable voice dictation for Windows (Whisper + local AI cleanup)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1",
    "numpy",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "Pillow>=10",
    # Settings window: shows web/ in Windows' built-in Edge WebView2.
    "pywebview>=5.3",
    # Reading the text box you dictate into (UI Automation) and muting other apps' sound.
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
]

[project.optional-dependencies]
# NVIDIA GPU support on Windows: the CUDA libraries faster-whisper needs.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# The built-in AI cleanup engine (llama.cpp). PyPI has it as source only: building it needs a C++
# compiler, so the release build compiles it once (see .github/workflows/release.yml). Without it,
# AI cleanup uses Ollama.
ai = ["llama-cpp-python==0.3.36"]
dev = ["pytest"]

[project.scripts]
hyper-wispr = "hyper_wispr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hyper_wispr", "hyper_wispr.settings_ui", "hyper_wispr.medical"]

[tool.setuptools.package-data]
"hyper_wispr.settings_ui" = ["web/*"]
"hyper_wispr.medical" = ["data/*"]

[tool.pytest.ini_options]
markers = ["builtin_ai: uses the built-in AI engine (local_llm) instead of the stand-in Ollama"]
